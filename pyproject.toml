[project]
name = "tool-gate"
version = "0.1.0"
description = "A typed judgment in Agent Control's model-backed slot: Jev decides deny, steer, or observe for an agent's tool calls"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "agent-control-evaluators==8.8.0",
    "agent-control-models==8.8.0",
    "agent-control-sdk==8.8.0",
    "agent-control-evaluator-jev-gate",
    "anthropic==1.8.0",
    "pydantic>=2.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
tg-freeze = "tool_gate.cli:freeze_main"
tg-eval = "tool_gate.cli:eval_main"
tg-demo = "tool_gate.cli:demo_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tool_gate"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
agent-control-evaluator-jev-gate = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["tests", "packages/agent-control-evaluator-jev-gate/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
